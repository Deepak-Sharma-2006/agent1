<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- Official Government of India Lion Capital Emblem Representation -->
  <g fill="#0F2942">
    <!-- Top Lions Stylized Silhouette -->
    <path d="M60 12 C52 12, 46 16, 42 22 C38 18, 30 18, 26 24 C22 30, 24 38, 28 42 C24 46, 26 54, 30 58 C34 62, 42 62, 48 58 C52 64, 68 64, 72 58 C78 62, 86 62, 90 58 C94 54, 96 46, 92 42 C96 38, 98 30, 94 24 C90 18, 82 18, 78 22 C74 16, 68 12, 60 12 Z" opacity="0.95"/>
    <!-- Center Mane Details -->
    <circle cx="60" cy="36" r="8" fill="#FFFFFF" opacity="0.2"/>
    <path d="M50 48 Q60 54 70 48 Q60 58 50 48 Z" fill="#0F2942"/>
    <!-- Abacus Base -->
    <rect x="22" y="72" width="76" height="14" rx="2" fill="#0F2942"/>
    <!-- Ashoka Chakra (Center Wheel with 24 Spokes representation) -->
    <circle cx="60" cy="79" r="6" fill="#FFFFFF"/>
    <circle cx="60" cy="79" r="4.5" fill="#0F2942"/>
    <circle cx="60" cy="79" r="1.5" fill="#FFFFFF"/>
    <!-- Galloping Horse & Bull (Left & Right representations) -->
    <ellipse cx="36" cy="79" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="84" cy="79" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Inverted Lotus Base -->
    <path d="M28 86 Q60 98 92 86 L88 100 Q60 108 32 100 Z" fill="#0F2942" opacity="0.9"/>
    <!-- Plinth Foundation -->
    <rect x="20" y="104" width="80" height="6" rx="1" fill="#0F2942"/>
    <!-- Satyameva Jayate (Devanagari Script Representation) -->
    <text x="60" y="124" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#0F2942" letter-spacing="1.5">सत्यमेव जयते</text>
    <text x="60" y="136" font-family="'Inter', sans-serif" font-weight="600" font-size="6.5" text-anchor="middle" fill="#64748B" letter-spacing="1">GOVERNMENT OF INDIA</text>
  </g>
</svg>
