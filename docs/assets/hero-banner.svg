<svg viewBox="0 0 850 180" width="850" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .glow-beam {
        animation: beamMove 4s linear infinite;
      }
      @keyframes beamMove {
        0% { transform: translateX(-850px); }
        100% { transform: translateX(850px); }
      }

      .pulse-dot-cyan {
        animation: pulseCyan 2s ease-in-out infinite;
      }
      @keyframes pulseCyan {
        0%, 100% { opacity: 1; r: 3.5; }
        50% { opacity: 0.4; r: 2.5; }
      }

      .pulse-dot-emerald {
        animation: pulseEmerald 2.5s ease-in-out infinite;
      }
      @keyframes pulseEmerald {
        0%, 100% { opacity: 1; r: 3.5; }
        50% { opacity: 0.4; r: 2.5; }
      }

      .txt-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px; fill: #38bdf8; text-transform: uppercase; }
      .txt-ver { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: url(#titleGrad); letter-spacing: -0.5px; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .txt-stat { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="180" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Animated Gradient Beam -->
  <g clip-path="url(#beamClip)">
    <clipPath id="beamClip">
      <rect x="0" y="0" width="850" height="4" rx="2"/>
    </clipPath>
    <rect class="glow-beam" x="0" y="0" width="850" height="3" fill="url(#beamGrad)"/>
  </g>

  <!-- Top Row: Badge & Version -->
  <rect x="28" y="24" width="160" height="24" rx="12" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
  <circle class="pulse-dot-cyan" cx="42" cy="36" r="3.5" fill="#38bdf8" filter="url(#glowFilter)"/>
  <text x="54" y="40" class="txt-brand">DEALFLOW360</text>
  <text x="822" y="40" text-anchor="end" class="txt-ver">Production Engine v1.0.0 &bull; Node.js 22+ Native</text>

  <!-- Hero Titles -->
  <text x="28" y="86" class="txt-title">Autonomous CPQ &amp; Sales Operations Platform</text>
  <text x="28" y="112" class="txt-sub">Multi-Tier Pricing Governance &bull; Distributed Warehouse Logistics &bull; GAAP Milestone Billing</text>

  <!-- Divider -->
  <line x1="28" y1="134" x2="822" y2="134" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom Stats Row -->
  <circle class="pulse-dot-emerald" cx="35" cy="154" r="3.5" fill="#10b981" filter="url(#glowFilter)"/>
  <text x="46" y="158" class="txt-stat">179/179 Unit Tests Passing</text>

  <circle class="pulse-dot-cyan" cx="260" cy="154" r="3.5" fill="#06b6d4" filter="url(#glowFilter)"/>
  <text x="271" y="158" class="txt-stat">48ms Cold Boot</text>

  <circle cx="430" cy="154" r="3.5" fill="#3b82f6"/>
  <text x="441" y="158" class="txt-stat">Zero Ghost Packages</text>

  <circle cx="630" cy="154" r="3.5" fill="#f59e0b"/>
  <text x="641" y="158" class="txt-stat">RFC 6455 Real-Time WebSockets</text>
</svg>
