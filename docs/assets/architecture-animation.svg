<svg viewBox="0 0 850 240" width="850" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glowFilt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sig-flow-1 {
        animation: flow1 2s linear infinite;
      }
      .sig-flow-2 {
        animation: flow2 2s linear 1s infinite;
      }
      @keyframes flow1 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(65px); opacity: 0; }
      }
      @keyframes flow2 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(65px); opacity: 0; }
      }

      .pulse-ring {
        animation: ringP 2s infinite;
      }
      @keyframes ringP {
        0% { r: 3.5; opacity: 1; }
        50% { r: 5; opacity: 0.5; }
        100% { r: 3.5; opacity: 1; }
      }

      .txt-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
      .txt-m-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .txt-m-val { fill: #cbd5e1; font-weight: 600; }
      .txt-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase; }
      .txt-node-t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .txt-node-d { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="850" height="240" rx="12" fill="#090e1a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <circle class="pulse-ring" cx="30" cy="24" r="4" fill="#10b981" filter="url(#glowFilt)"/>
  <text x="44" y="28" class="txt-hdr">Real-Time Transactional Execution Pipeline</text>

  <text x="560" y="28" class="txt-m-label">Roundtrip: <tspan class="txt-m-val">&lt; 0.4ms</tspan></text>
  <text x="670" y="28" class="txt-m-label">WS Broadcast: <tspan class="txt-m-val">&lt; 5ms</tspan></text>
  <text x="770" y="28" class="txt-m-label">OCC: <tspan class="txt-m-val">Strict</tspan></text>

  <line x1="20" y1="42" x2="830" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- Node 1: Client Tier -->
  <g transform="translate(24, 60)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="28" class="txt-tag">Client Tier</text>
    <text x="16" y="52" class="txt-node-t">React 18 SPA</text>
    <text x="16" y="78" class="txt-node-d">&bull; Quotation Studio</text>
    <text x="16" y="100" class="txt-node-d">&bull; Cloaked Customer Portal</text>
    <text x="16" y="122" class="txt-node-d">&bull; Offline IndexedDB PWA</text>
  </g>

  <!-- Pipe 1 -->
  <g transform="translate(234, 130)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#334155" stroke-width="2"/>
    <circle class="sig-flow-1" cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glowFilt)"/>
  </g>

  <!-- Node 2: Native Server -->
  <g transform="translate(299, 60)">
    <rect width="250" height="150" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="16" y="28" class="txt-tag" fill="#38bdf8">Native Node.js Server</text>
    <text x="16" y="52" class="txt-node-t">Router &amp; Domain Engines</text>
    <text x="16" y="78" class="txt-node-d">&bull; RFC 6455 Real-Time WebSockets</text>
    <text x="16" y="100" class="txt-node-d">&bull; Integer-Cents Financial Math</text>
    <text x="16" y="122" class="txt-node-d">&bull; BAFO Fallback &amp; O(W&times;K) Split</text>
  </g>

  <!-- Pipe 2 -->
  <g transform="translate(549, 130)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#334155" stroke-width="2"/>
    <circle class="sig-flow-2" cx="0" cy="0" r="4" fill="#10b981" filter="url(#glowFilt)"/>
  </g>

  <!-- Node 3: Persistence Tier -->
  <g transform="translate(614, 60)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="28" class="txt-tag">Persistence Tier</text>
    <text x="16" y="52" class="txt-node-t">SQLite WAL + Cache</text>
    <text x="16" y="78" class="txt-node-d">&bull; Foreign Keys &amp; Cascades</text>
    <text x="16" y="100" class="txt-node-d">&bull; Concurrency Control (OCC)</text>
    <text x="16" y="122" class="txt-node-d">&bull; Sub-1ms Atomic Commits</text>
  </g>
</svg>
