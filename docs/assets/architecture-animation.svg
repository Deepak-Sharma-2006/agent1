<svg fill="none" viewBox="0 0 850 280" width="850" height="280" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .flow-container {
          width: 850px;
          height: 280px;
          background: #090e1a;
          border-radius: 12px;
          border: 1px solid #1e293b;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #f1f5f9;
          box-sizing: border-box;
          padding: 20px 24px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }

        .flow-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          padding-bottom: 10px;
        }

        .flow-title {
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #38bdf8;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .pulse-indicator {
          width: 8px;
          height: 8px;
          background: #10b981;
          border-radius: 50%;
          animation: ringPulse 2s infinite;
        }

        @keyframes ringPulse {
          0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
          100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .flow-grid {
          display: grid;
          grid-template-columns: 1fr 40px 1.2fr 40px 1fr;
          align-items: center;
          margin-top: 15px;
          height: 180px;
        }

        .node-box {
          background: #0f172a;
          border: 1px solid #334155;
          border-radius: 8px;
          padding: 14px 16px;
          display: flex;
          flex-direction: column;
          gap: 6px;
          transition: border-color 0.3s;
        }

        .node-box:hover {
          border-color: #38bdf8;
        }

        .node-tag {
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #94a3b8;
        }

        .node-title {
          font-size: 14px;
          font-weight: 700;
          color: #ffffff;
        }

        .node-desc {
          font-size: 11px;
          color: #94a3b8;
          line-height: 1.4;
        }

        .pipe {
          position: relative;
          height: 2px;
          background: #334155;
          overflow: hidden;
        }

        .packet {
          position: absolute;
          top: 0;
          left: -20px;
          width: 20px;
          height: 2px;
          background: linear-gradient(90deg, transparent, #38bdf8, #10b981);
          animation: flowSignal 1.8s linear infinite;
        }

        .pipe-reverse .packet {
          animation: flowSignalReverse 1.8s linear infinite;
          background: linear-gradient(90deg, #10b981, #38bdf8, transparent);
        }

        @keyframes flowSignal {
          0% { left: -20px; }
          100% { left: 100%; }
        }

        @keyframes flowSignalReverse {
          0% { left: 100%; }
          100% { left: -20px; }
        }

        .footer-metrics {
          display: flex;
          gap: 24px;
          font-size: 11.5px;
          color: #64748b;
        }

        .metric-val {
          color: #f1f5f9;
          font-weight: 600;
        }
      </style>

      <div class="flow-container">
        <div class="flow-header">
          <div class="flow-title">
            <span class="pulse-indicator"></span>
            Real-Time Transactional Execution Pipeline
          </div>
          <div class="footer-metrics">
            <span>Roundtrip Latency: <span class="metric-val">&lt; 0.4ms</span></span>
            <span>WebSocket Broadcast: <span class="metric-val">&lt; 5ms</span></span>
            <span>Concurrency Isolation: <span class="metric-val">OCC Strict</span></span>
          </div>
        </div>

        <div class="flow-grid">
          <!-- Client Layer -->
          <div class="node-box">
            <span class="node-tag">Client Tier</span>
            <span class="node-title">React 18 SPA</span>
            <span class="node-desc">Quotation Studio &bull; Customer Portal &bull; Offline Service Worker</span>
          </div>

          <!-- Connecting Pipe 1 -->
          <div class="pipe">
            <div class="packet"></div>
          </div>

          <!-- Gateway & Domain -->
          <div class="node-box" style="border-color: rgba(56, 189, 248, 0.4);">
            <span class="node-tag" style="color: #38bdf8;">Native Node.js Server</span>
            <span class="node-title">Router &amp; Domain Engines</span>
            <span class="node-desc">RFC 6455 WebSockets &bull; Integer-Cents Math &bull; BAFO Fallback &bull; O(W&times;K) ATP</span>
          </div>

          <!-- Connecting Pipe 2 -->
          <div class="pipe">
            <div class="packet" style="animation-delay: 0.9s;"></div>
          </div>

          <!-- Storage Tier -->
          <div class="node-box">
            <span class="node-tag">Persistence Tier</span>
            <span class="node-title">SQLite WAL + MemStore</span>
            <span class="node-desc">Foreign Keys &bull; Transactional OCC &bull; Sub-1ms Query Execution</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
